ServerName localhost

<VirtualHost *:80>

    # Serve static files directly
    Alias /static/ /app/staticfiles/
    <Directory /app/staticfiles/>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    # Uploads are private: thumbnails go through Django's access check
    # (/upload/thumbnail/<id>/) and originals are never served over HTTP.
    <Location /media/>
        Require all denied
    </Location>

    # Forward everything else to Gunicorn
    ProxyPreserveHost On
    ProxyPass /static/ !
    ProxyPass /media/ !
    ProxyPass / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/

</VirtualHost>
